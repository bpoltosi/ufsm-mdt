name: Build MDT fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Generate all supported document projects
        run: |
          for f in tests/fixtures/*/document.json; do
            id="$(basename "$(dirname "$f")")"
            python -m ufsm_mdt.cli generate "$f" "build/fixtures/$id"
          done
      - name: Compile all fixtures with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: build/fixtures/*/main.tex
          texlive_version: "2026"
          latexmk_use_xelatex: true
          work_in_root_file_dir: true
          continue_on_error: true
      - name: Package fixture PDFs
        uses: actions/upload-artifact@v7
        with:
          name: ufsm-mdt-fixture-pdfs
          path: build/fixtures/*/main.pdf
