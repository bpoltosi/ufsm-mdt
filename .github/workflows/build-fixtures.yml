name: Build MDT fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fixtures
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        type:
          - article
          - didactic-material
          - dissertation
          - internship-report
          - monograph
          - pedagogical-resource
          - professional-project
          - research-project
          - tcc
          - technical-report
          - thesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - run: |
          set -euo pipefail
          python -m ufsm_mdt.cli generate tests/fixtures/${{ matrix.type }}/document.json build/${{ matrix.type }}
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: build/${{ matrix.type }}/main.tex
          texlive_version: "2026"
          latexmk_use_xelatex: true
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ufsm-mdt-${{ matrix.type }}
          path: build/${{ matrix.type }}/main.pdf
          retention-days: 3
          if-no-files-found: error
