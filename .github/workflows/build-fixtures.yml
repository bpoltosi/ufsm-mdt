name: Build MDT fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fixtures
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - run: |
          set -euo pipefail
          python -m ufsm_mdt.cli generate tests/fixtures/dissertation/document.json build/fixture
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: build/fixture/main.tex
          texlive_version: "2026"
          latexmk_use_xelatex: true
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ufsm-mdt-fixture-dissertation
          path: build/fixture/main.pdf
          retention-days: 3
          if-no-files-found: error
