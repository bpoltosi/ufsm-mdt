name: Build PDF on demand

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Tipo de trabalho"
        required: true
        type: choice
        options:
          - research-project
          - tcc
          - internship-report
          - dissertation
          - thesis
          - article
          - technical-report
          - monograph
          - didactic-material
          - pedagogical-resource
          - professional-project

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Generate requested project
        env:
          TYPE: ${{ inputs.type }}
        run: python -m ufsm_mdt.cli generate "tests/fixtures/$TYPE/document.json" "build/requested"
      - name: Compile requested PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: build/requested/main.tex
          texlive_version: "2026"
          latexmk_use_xelatex: true
          work_in_root_file_dir: true
      - name: Upload requested PDF
        uses: actions/upload-artifact@v7
        with:
          name: ufsm-mdt-${{ inputs.type }}-pdf
          path: build/requested/main.pdf
